<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Example 05 - Lines, Points &amp; Custom BufferGeometry</title>
    <style>
    html, body { height: 100%; margin: 0; }
    #c { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
  </body>
<script type="module">
import * as THREE from './resources/threejs/r132/build/three.module.js';

function main() {
  const canvas = document.querySelector('#c');
  const renderer = new THREE.WebGLRenderer({canvas});

  const camera = new THREE.PerspectiveCamera(60, 2, 0.1, 50);
  camera.position.set(0, 1.2, 6.8);
  camera.lookAt(0, 0, 0);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x10141f);

  const light = new THREE.DirectionalLight(0xffffff, 1.0);
  light.position.set(3, 5, 4);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x404040));

  // 1. Custom indexed BufferGeometry (pyramid) with vertex colors
  const customGeo = new THREE.BufferGeometry();
  const positions = [
     0.0,  0.9,  0.0, // apex
    -0.8, -0.6,  0.8, // front-left
     0.8, -0.6,  0.8, // front-right
     0.8, -0.6, -0.8, // back-right
    -0.8, -0.6, -0.8, // back-left
  ];
  const colors = [
    1.0, 1.0, 0.2,
    1.0, 0.2, 0.2,
    0.2, 1.0, 0.3,
    0.2, 0.5, 1.0,
    0.9, 0.2, 1.0,
  ];
  customGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  customGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  customGeo.setIndex([
    0, 1, 2,
    0, 2, 3,
    0, 3, 4,
    0, 4, 1,
    1, 4, 3,
    1, 3, 2,
  ]);
  customGeo.computeVertexNormals();
  const pyramid = new THREE.Mesh(
    customGeo,
    new THREE.MeshBasicMaterial({vertexColors: true, side: THREE.DoubleSide})
  );
  pyramid.position.set(-2.7, 0, 0);
  scene.add(pyramid);

  // 2. Points cloud with vertex colors
  const ptGeo = new THREE.BufferGeometry();
  const ptPos = [];
  const ptCol = [];
  const count = 180;
  for (let i = 0; i < count; i++) {
    const t = (i / count) * Math.PI * 6;
    const r = 0.75 * Math.sin((i / count) * Math.PI);
    ptPos.push(Math.cos(t) * r, (i / count - 0.5) * 1.8, Math.sin(t) * r);
    ptCol.push(i / count, 1.0 - i / count, 0.85);
  }
  ptGeo.setAttribute('position', new THREE.Float32BufferAttribute(ptPos, 3));
  ptGeo.setAttribute('color', new THREE.Float32BufferAttribute(ptCol, 3));
  const points = new THREE.Points(
    ptGeo,
    new THREE.PointsMaterial({size: 0.12, vertexColors: true})
  );
  points.position.set(-0.9, 0, 0);
  scene.add(points);

  // 3. Continuous Line (helix)
  const linePts = [];
  for (let i = 0; i <= 60; i++) {
    const a = (i / 60) * Math.PI * 6;
    linePts.push(new THREE.Vector3(Math.cos(a) * 0.65, (i / 60 - 0.5) * 1.8, Math.sin(a) * 0.65));
  }
  const lineGeo = new THREE.BufferGeometry().setFromPoints(linePts);
  const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({color: 0x00e5ff}));
  line.position.set(0.9, 0, 0);
  scene.add(line);

  // 4. LineSegments + EdgesGeometry
  const edgesGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(1.25, 1.25, 1.25));
  const edges = new THREE.LineSegments(edgesGeo, new THREE.LineBasicMaterial({color: 0xffeb3b}));
  edges.position.set(2.7, 0, 0);
  scene.add(edges);

  const items = [pyramid, points, line, edges];

  function resizeRendererToDisplaySize(renderer) {
    const canvas = renderer.domElement;
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    const needResize = canvas.width !== width || canvas.height !== height;
    if (needResize) {
      renderer.setSize(width, height, false);
    }
    return needResize;
  }

  function render(time) {
    time *= 0.001;
    if (resizeRendererToDisplaySize(renderer)) {
      const canvas = renderer.domElement;
      camera.aspect = canvas.clientWidth / canvas.clientHeight;
      camera.updateProjectionMatrix();
    }
    items.forEach((obj, i) => {
      obj.rotation.y = time * (0.6 + i * 0.1);
      obj.rotation.x = Math.sin(time * 0.7 + i) * 0.35;
    });
    renderer.render(scene, camera);
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
}

main();
</script>
</html>
