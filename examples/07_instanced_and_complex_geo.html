<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Example 07 - InstancedMesh, Complex Geometries &amp; Clone</title>
    <style>
    html, body { height: 100%; margin: 0; }
    #c { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
  </body>
<script type="module">
import * as THREE from './resources/threejs/r132/build/three.module.js';

function main() {
  const canvas = document.querySelector('#c');
  const renderer = new THREE.WebGLRenderer({canvas});

  const camera = new THREE.PerspectiveCamera(55, 2, 0.1, 60);
  camera.position.set(0, 3.4, 8.2);
  camera.lookAt(0, 0, 0);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x14121d);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
  dirLight.position.set(5, 8, 6);
  scene.add(dirLight);
  scene.add(new THREE.AmbientLight(0x404055));

  // Complex geometries along top row
  const knot = new THREE.Mesh(
    new THREE.TorusKnotGeometry(0.55, 0.18, 48, 8),
    new THREE.MeshPhongMaterial({color: 0xff5252, shininess: 80})
  );
  knot.position.set(-2.7, 1.5, 0);
  scene.add(knot);

  const octa = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.68, 0),
    new THREE.MeshPhongMaterial({color: 0x40c4ff, flatShading: true})
  );
  octa.position.set(-0.9, 1.5, 0);
  scene.add(octa);

  const dodeca = new THREE.Mesh(
    new THREE.DodecahedronGeometry(0.68, 0),
    new THREE.MeshPhongMaterial({color: 0x69f0ae, flatShading: true})
  );
  dodeca.position.set(0.9, 1.5, 0);
  scene.add(dodeca);

  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.35, 0.72, 24),
    new THREE.MeshBasicMaterial({color: 0xffd740, side: THREE.DoubleSide})
  );
  ring.position.set(2.7, 1.5, 0);
  scene.add(ring);

  // Clone test (cloned octahedron placed below)
  const octaClone = octa.clone();
  octaClone.position.set(3.5, -1.2, 0);
  octaClone.scale.setScalar(0.65);
  scene.add(octaClone);

  // InstancedMesh: 5x5 grid of cubes
  const gridN = 5;
  const count = gridN * gridN;
  const instGeo = new THREE.BoxGeometry(0.55, 0.55, 0.55);
  const instMat = new THREE.MeshPhongMaterial({color: 0xffffff});
  const instMesh = new THREE.InstancedMesh(instGeo, instMat, count);
  const dummy = new THREE.Object3D();
  const color = new THREE.Color();

  for (let i = 0; i < count; i++) {
    const gx = i % gridN;
    const gz = Math.floor(i / gridN);
    color.setHSL((gx + gz) / (gridN * 2), 0.75, 0.55);
    instMesh.setColorAt(i, color);
  }
  if (instMesh.instanceColor) {
    instMesh.instanceColor.needsUpdate = true;
  }
  scene.add(instMesh);

  const topMeshes = [knot, octa, dodeca, ring, octaClone];

  function resizeRendererToDisplaySize(renderer) {
    const canvas = renderer.domElement;
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    const needResize = canvas.width !== width || canvas.height !== height;
    if (needResize) {
      renderer.setSize(width, height, false);
    }
    return needResize;
  }

  function render(time) {
    time *= 0.001;
    if (resizeRendererToDisplaySize(renderer)) {
      const canvas = renderer.domElement;
      camera.aspect = canvas.clientWidth / canvas.clientHeight;
      camera.updateProjectionMatrix();
    }

    topMeshes.forEach((m, i) => {
      m.rotation.x = time * (0.5 + i * 0.1);
      m.rotation.y = time * (0.7 + i * 0.08);
    });

    let idx = 0;
    for (let gz = 0; gz < gridN; gz++) {
      for (let gx = 0; gx < gridN; gx++) {
        const x = (gx - (gridN - 1) / 2) * 0.95;
        const z = (gz - (gridN - 1) / 2) * 0.95;
        const y = -1.35 + Math.sin(time * 2.2 + gx * 0.6 + gz * 0.6) * 0.3;
        dummy.position.set(x, y, z);
        dummy.rotation.set(time * 0.8 + gx * 0.2, time * 0.6 + gz * 0.2, 0);
        dummy.updateMatrix();
        instMesh.setMatrixAt(idx++, dummy.matrix);
      }
    }
    instMesh.instanceMatrix.needsUpdate = true;

    renderer.render(scene, camera);
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
}

main();
</script>
</html>
