<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Example 08 - Dynamic Vertices, Raycaster &amp; Pointer Orbit</title>
    <style>
    html, body { height: 100%; margin: 0; }
    #c { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
  </body>
<script type="module">
import * as THREE from './resources/threejs/r132/build/three.module.js';

function main() {
  const canvas = document.querySelector('#c');
  const renderer = new THREE.WebGLRenderer({canvas});

  const camera = new THREE.PerspectiveCamera(55, 2, 0.1, 60);
  let orbitYaw = 0.4;
  let orbitPitch = 0.55;
  const orbitDist = 8.5;

  function updateCamera() {
    const cp = Math.cos(orbitPitch);
    camera.position.set(
      Math.sin(orbitYaw) * cp * orbitDist,
      Math.sin(orbitPitch) * orbitDist,
      Math.cos(orbitYaw) * cp * orbitDist
    );
    camera.lookAt(0, 0, 0);
  }
  updateCamera();

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111a24);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
  dirLight.position.set(4, 7, 5);
  scene.add(dirLight);
  scene.add(new THREE.AmbientLight(0x3b4a5a));

  // Dynamic wave mesh (per-frame BufferAttribute mutation)
  const waveGeo = new THREE.PlaneGeometry(6.5, 6.5, 16, 16);
  waveGeo.rotateX(-Math.PI / 2);
  const waveMesh = new THREE.Mesh(
    waveGeo,
    new THREE.MeshPhongMaterial({color: 0x26a69a, flatShading: true, side: THREE.DoubleSide})
  );
  waveMesh.position.y = -1.2;
  scene.add(waveMesh);

  // Pickable cubes for Raycaster hover/click test
  const pickables = [];
  const boxGeo = new THREE.BoxGeometry(1.0, 1.0, 1.0);
  const baseColors = [0xef5350, 0x42a5f5, 0xffca28];
  baseColors.forEach((hex, i) => {
    const mat = new THREE.MeshPhongMaterial({color: hex});
    const mesh = new THREE.Mesh(boxGeo, mat);
    mesh.position.set((i - 1) * 2.1, 0.6, 0);
    mesh.userData.baseColor = hex;
    mesh.userData.selected = false;
    scene.add(mesh);
    pickables.push(mesh);
  });

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2(-99, -99);
  let hovered = null;
  let dragging = false;
  let lastX = 0;
  let lastY = 0;

  function setPointerFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  }

  canvas.addEventListener('pointerdown', (e) => {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    setPointerFromEvent(e);
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(pickables);
    if (hits.length > 0) {
      const obj = hits[0].object;
      obj.userData.selected = !obj.userData.selected;
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    setPointerFromEvent(e);
    if (dragging) {
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      orbitYaw -= dx * 0.01;
      orbitPitch = Math.max(0.1, Math.min(1.4, orbitPitch + dy * 0.01));
      updateCamera();
    }
  });

  canvas.addEventListener('pointerup', () => {
    dragging = false;
  });

  function resizeRendererToDisplaySize(renderer) {
    const canvas = renderer.domElement;
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    const needResize = canvas.width !== width || canvas.height !== height;
    if (needResize) {
      renderer.setSize(width, height, false);
    }
    return needResize;
  }

  function render(time) {
    time *= 0.001;
    if (resizeRendererToDisplaySize(renderer)) {
      const canvas = renderer.domElement;
      camera.aspect = canvas.clientWidth / canvas.clientHeight;
      camera.updateProjectionMatrix();
    }

    // Update wave vertices each frame
    const pos = waveGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const z = pos.getZ(i);
      const y = Math.sin(x * 1.1 + time * 2.2) * Math.cos(z * 1.1 + time * 1.6) * 0.45;
      pos.setY(i, y);
    }
    pos.needsUpdate = true;
    waveGeo.computeVertexNormals();

    // Raycast hover check
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(pickables);
    hovered = hits.length > 0 ? hits[0].object : null;

    pickables.forEach((m, i) => {
      m.rotation.y = time * (0.6 + i * 0.2);
      if (m.userData.selected) {
        m.material.color.setHex(0xffffff);
      } else if (m === hovered) {
        m.material.color.setHex(0x69f0ae);
      } else {
        m.material.color.setHex(m.userData.baseColor);
      }
    });

    renderer.render(scene, camera);
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
}

main();
</script>
</html>
