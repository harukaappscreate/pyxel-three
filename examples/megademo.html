<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>THREE.JS x PYXEL 3 - MEGADEMO</title>
    <style>
    html, body { height: 100%; margin: 0; }
    #c { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
  </body>
<script type="module">
import * as THREE from './resources/threejs/r132/build/three.module.js';

function makeCheckerCanvasTexture() {
  const cv = document.createElement('canvas');
  cv.width = 64;
  cv.height = 64;
  const ctx = cv.getContext('2d');
  for (let y = 0; y < 4; y++) {
    for (let x = 0; x < 4; x++) {
      ctx.fillStyle = (x + y) % 2 === 0 ? '#112244' : '#ff4466';
      ctx.fillRect(x * 16, y * 16, 16, 16);
    }
  }
  ctx.fillStyle = '#ffee55';
  ctx.fillRect(4, 24, 56, 16);
  const tex = new THREE.CanvasTexture(cv);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  return tex;
}

function makeVertexColorPyramid() {
  const geo = new THREE.BufferGeometry();
  const positions = [
     0.0,  0.65,  0.0,
    -0.45, -0.4,  0.45,
     0.45, -0.4,  0.45,
     0.45, -0.4, -0.45,
    -0.45, -0.4, -0.45,
  ];
  const colors = [
    1.0, 1.0, 0.2,
    1.0, 0.2, 0.3,
    0.2, 1.0, 0.4,
    0.2, 0.6, 1.0,
    0.9, 0.3, 1.0,
  ];
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.setIndex([
    0, 1, 2,
    0, 2, 3,
    0, 3, 4,
    0, 4, 1,
    1, 4, 3,
    1, 3, 2,
  ]);
  geo.computeVertexNormals();
  return new THREE.Mesh(
    geo,
    new THREE.MeshBasicMaterial({vertexColors: true, side: THREE.DoubleSide})
  );
}

function main() {
  const canvas = document.querySelector('#c');
  const renderer = new THREE.WebGLRenderer({canvas});
  renderer.shadowMap.enabled = true;

  const camera = new THREE.PerspectiveCamera(58, 2, 0.1, 80);
  const scene = new THREE.Scene();
  const fogColor = 0x0b0f1d;
  scene.background = new THREE.Color(fogColor);
  scene.fog = new THREE.Fog(fogColor, 9, 28);

  // Lights
  scene.add(new THREE.AmbientLight(0x283048, 0.8));
  scene.add(new THREE.HemisphereLight(0x66aaff, 0x221133, 0.7));

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
  dirLight.position.set(5, 9, 6);
  dirLight.castShadow = true;
  scene.add(dirLight);

  const pLight1 = new THREE.PointLight(0xff3366, 2.2, 18);
  const pLight2 = new THREE.PointLight(0x33eeff, 2.2, 18);
  scene.add(pLight1);
  scene.add(pLight2);

  // 1. Dynamic cyber wave floor
  const floorGeo = new THREE.PlaneGeometry(18, 18, 12, 12);
  floorGeo.rotateX(-Math.PI / 2);
  const floor = new THREE.Mesh(
    floorGeo,
    new THREE.MeshStandardMaterial({
      color: 0x1b4f72,
      roughness: 0.45,
      metalness: 0.35,
      flatShading: true,
    })
  );
  floor.position.y = -2.2;
  floor.receiveShadow = true;
  scene.add(floor);

  // 2. Hero centerpiece group (TorusKnot + EdgesGeometry cage + orbiting satellites)
  const coreGroup = new THREE.Group();
  coreGroup.position.y = 0.7;
  scene.add(coreGroup);

  const knot = new THREE.Mesh(
    new THREE.TorusKnotGeometry(1.05, 0.32, 42, 8),
    new THREE.MeshPhongMaterial({
      color: 0xffaa22,
      emissive: 0x331100,
      shininess: 90,
    })
  );
  knot.castShadow = true;
  coreGroup.add(knot);

  const cageGeo = new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(2.15, 0));
  const cage = new THREE.LineSegments(
    cageGeo,
    new THREE.LineBasicMaterial({color: 0x00ffff})
  );
  coreGroup.add(cage);

  // Vertex-color pyramids orbiting core
  const pyramids = [];
  for (let i = 0; i < 4; i++) {
    const pyr = makeVertexColorPyramid();
    pyr.castShadow = true;
    coreGroup.add(pyr);
    pyramids.push(pyr);
  }

  // 3. InstancedMesh equalizer ring (16 pillars)
  const pillarCount = 16;
  const pillarGeo = new THREE.BoxGeometry(0.45, 1.0, 0.45);
  const pillarMat = new THREE.MeshPhongMaterial({color: 0xffffff, shininess: 60});
  const pillars = new THREE.InstancedMesh(pillarGeo, pillarMat, pillarCount);
  pillars.castShadow = true;
  const dummy = new THREE.Object3D();
  const col = new THREE.Color();
  for (let i = 0; i < pillarCount; i++) {
    col.setHSL(i / pillarCount, 0.9, 0.55);
    pillars.setColorAt(i, col);
  }
  if (pillars.instanceColor) {
    pillars.instanceColor.needsUpdate = true;
  }
  scene.add(pillars);

  // 4. Procedural CanvasTexture cubes
  const checkerTex = makeCheckerCanvasTexture();
  const texMat = new THREE.MeshLambertMaterial({map: checkerTex});
  const texGeo = new THREE.BoxGeometry(0.75, 0.75, 0.75);
  const texCubes = [];
  for (let i = 0; i < 3; i++) {
    const m = new THREE.Mesh(texGeo, texMat);
    m.castShadow = true;
    scene.add(m);
    texCubes.push(m);
  }

  // 5. Starfield Points with vertex colors
  const starCount = 220;
  const starGeo = new THREE.BufferGeometry();
  const starPos = [];
  const starCol = [];
  for (let i = 0; i < starCount; i++) {
    const a = i * 2.39996;
    const r = 6.5 + (i % 11) * 1.1;
    const y = ((i * 37) % 100) / 100 * 10 - 2.0;
    starPos.push(Math.cos(a) * r, y, Math.sin(a) * r);
    const c = new THREE.Color().setHSL((i % 20) / 20, 0.8, 0.7);
    starCol.push(c.r, c.g, c.b);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
  starGeo.setAttribute('color', new THREE.Float32BufferAttribute(starCol, 3));
  const stars = new THREE.Points(
    starGeo,
    new THREE.PointsMaterial({size: 0.14, vertexColors: true})
  );
  scene.add(stars);

  // Optional pointer drag orbit
  let userYawOffset = 0;
  let userPitchOffset = 0;
  let dragging = false;
  let lastX = 0;
  let lastY = 0;
  canvas.addEventListener('pointerdown', (e) => {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    userYawOffset -= (e.clientX - lastX) * 0.012;
    userPitchOffset = Math.max(-0.4, Math.min(0.6, userPitchOffset + (e.clientY - lastY) * 0.01));
    lastX = e.clientX;
    lastY = e.clientY;
  });
  canvas.addEventListener('pointerup', () => {
    dragging = false;
  });

  function resizeRendererToDisplaySize(renderer) {
    const c = renderer.domElement;
    const w = c.clientWidth;
    const h = c.clientHeight;
    const needResize = c.width !== w || c.height !== h;
    if (needResize) {
      renderer.setSize(w, h, false);
    }
    return needResize;
  }

  function render(time) {
    time *= 0.001;
    if (resizeRendererToDisplaySize(renderer)) {
      const c = renderer.domElement;
      camera.aspect = c.clientWidth / c.clientHeight;
      camera.updateProjectionMatrix();
    }

    // Orbiting point lights
    pLight1.position.set(Math.cos(time * 1.3) * 4.5, 2.2 + Math.sin(time * 2.0), Math.sin(time * 1.3) * 4.5);
    pLight2.position.set(Math.cos(-time * 1.1) * 4.5, 1.8 + Math.cos(time * 1.7), Math.sin(-time * 1.1) * 4.5);

    // Hero animations
    knot.rotation.x = time * 0.85;
    knot.rotation.y = time * 1.15;
    cage.rotation.x = -time * 0.35;
    cage.rotation.y = -time * 0.55;

    pyramids.forEach((p, i) => {
      const a = time * 1.4 + (i * Math.PI) / 2;
      p.position.set(Math.cos(a) * 3.1, Math.sin(time * 2.2 + i) * 0.7, Math.sin(a) * 3.1);
      p.rotation.y = time * 2.5 + i;
      p.rotation.x = Math.sin(time + i) * 0.5;
    });

    // InstancedMesh equalizer ring
    for (let i = 0; i < pillarCount; i++) {
      const a = (i / pillarCount) * Math.PI * 2 + time * 0.25;
      const r = 4.9;
      const h = 0.8 + 1.1 * (0.5 + 0.5 * Math.sin(time * 3.2 + i * 0.8));
      dummy.position.set(Math.cos(a) * r, -2.0 + h * 0.5, Math.sin(a) * r);
      dummy.rotation.set(0, -a, 0);
      dummy.scale.set(1, h, 1);
      dummy.updateMatrix();
      pillars.setMatrixAt(i, dummy.matrix);
    }
    pillars.instanceMatrix.needsUpdate = true;

    // Textured cubes
    texCubes.forEach((c, i) => {
      const a = -time * 0.9 + (i * Math.PI * 2) / 3;
      c.position.set(Math.cos(a) * 3.8, 2.3 + Math.sin(time * 1.8 + i) * 0.45, Math.sin(a) * 3.8);
      c.rotation.x = time * 1.3 + i;
      c.rotation.y = time * 1.6 + i;
    });

    // Dynamic cyber wave floor
    const fPos = floorGeo.attributes.position;
    for (let i = 0; i < fPos.count; i++) {
      const fx = fPos.getX(i);
      const fz = fPos.getZ(i);
      const fy = Math.sin(fx * 0.55 + time * 2.4) * Math.cos(fz * 0.55 + time * 1.8) * 0.42;
      fPos.setY(i, fy);
    }
    fPos.needsUpdate = true;
    floorGeo.computeVertexNormals();

    stars.rotation.y = time * 0.08;

    // Smooth demo camera
    const camAngle = time * 0.35 + userYawOffset;
    const camDist = 7.6 + Math.sin(time * 0.45) * 1.1;
    const camY = 2.4 + Math.sin(time * 0.6) * 0.9 + userPitchOffset * 4.0;
    camera.position.set(Math.cos(camAngle) * camDist, camY, Math.sin(camAngle) * camDist);
    camera.lookAt(0, 0.3, 0);

    renderer.render(scene, camera);
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
}

main();
</script>
</html>
