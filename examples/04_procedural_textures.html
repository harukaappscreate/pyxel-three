<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Example 04 - Procedural Textures</title>
    <style>
    html, body { height: 100%; margin: 0; }
    #c { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
  </body>
<script type="module">
import * as THREE from './resources/threejs/r132/build/three.module.js';

function makeDataTexture() {
  const size = 8;
  const data = new Uint8Array(size * size * 4);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const i = (y * size + x) * 4;
      const white = (x + y) % 2 === 0;
      data[i + 0] = white ? 240 : 40;
      data[i + 1] = white ? 220 : 100;
      data[i + 2] = white ? 80 : 220;
      data[i + 3] = 255;
    }
  }
  const tex = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.needsUpdate = true;
  return tex;
}

function makeCanvasTexture() {
  const cv = document.createElement('canvas');
  cv.width = 64;
  cv.height = 64;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#223355';
  ctx.fillRect(0, 0, 64, 64);
  ctx.fillStyle = '#ff5544';
  ctx.fillRect(4, 4, 56, 12);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 18px monospace';
  ctx.fillText('3JS', 14, 42);
  const tex = new THREE.CanvasTexture(cv);
  tex.magFilter = THREE.NearestFilter;
  return tex;
}

function main() {
  const canvas = document.querySelector('#c');
  const renderer = new THREE.WebGLRenderer({canvas});

  const camera = new THREE.PerspectiveCamera(60, 2, 0.1, 30);
  camera.position.set(0, 0.4, 4.8);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x161820);

  const geo = new THREE.BoxGeometry(1.2, 1.2, 1.2);

  const dataTex = makeDataTexture();
  const c1 = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({map: dataTex}));
  c1.position.x = -1.9;
  scene.add(c1);

  const canvasTex = makeCanvasTexture();
  const c2 = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({map: canvasTex}));
  c2.position.x = 0;
  scene.add(c2);

  const repTex = makeDataTexture();
  repTex.wrapS = THREE.RepeatWrapping;
  repTex.wrapT = THREE.RepeatWrapping;
  repTex.repeat.set(2, 2);
  const c3 = new THREE.Mesh(
    geo,
    new THREE.MeshBasicMaterial({map: repTex, transparent: true, opacity: 0.65})
  );
  c3.position.x = 1.9;
  scene.add(c3);

  const cubes = [c1, c2, c3];

  function resizeRendererToDisplaySize(renderer) {
    const canvas = renderer.domElement;
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    const needResize = canvas.width !== width || canvas.height !== height;
    if (needResize) {
      renderer.setSize(width, height, false);
    }
    return needResize;
  }

  function render(time) {
    time *= 0.001;
    if (resizeRendererToDisplaySize(renderer)) {
      const canvas = renderer.domElement;
      camera.aspect = canvas.clientWidth / canvas.clientHeight;
      camera.updateProjectionMatrix();
    }
    cubes.forEach((c, i) => {
      c.rotation.x = time * (0.4 + i * 0.15);
      c.rotation.y = time * (0.6 + i * 0.15);
    });
    renderer.render(scene, camera);
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
}

main();
</script>
</html>
